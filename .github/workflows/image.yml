name: Image

# Builds the container image from `ref` for amd64 and arm64 and pushes it to ghcr as `tag`.
on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
      tag:
        type: string
        required: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Clone
        env:
          TOKEN: ${{ github.token }}
          REF: ${{ inputs.ref }}
        run: |
          git init -q .
          git -c http.extraHeader="Authorization: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)" \
            fetch -q --depth 1 "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$REF"
          git checkout -q FETCH_HEAD

      - name: Build and push by digest
        env:
          TOKEN: ${{ github.token }}
          ARCH: ${{ matrix.arch }}
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx create --use
          docker buildx build --platform "linux/$ARCH" --pull --no-cache \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --output "type=image,name=ghcr.io/${GITHUB_REPOSITORY,,},push-by-digest=true,name-canonical=true,push=true" \
            --metadata-file metadata.json -f Containerfile .
          mkdir digests
          digest="$(jq -r '."containerimage.digest"' metadata.json)"
          touch "digests/${digest#sha256:}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.arch }}
          path: digests/*
          if-no-files-found: error
          retention-days: 1

  manifest:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          merge-multiple: true
          path: digests

      - name: Push the multi-platform tag
        env:
          TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx imagetools create -t "$repo:$TAG" $(printf "$repo@sha256:%s " $(ls digests))
