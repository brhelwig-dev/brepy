name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "23 10 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Clone
        env:
          TOKEN: ${{ github.token }}
        run: |
          git init -q .
          git -c http.extraHeader="Authorization: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)" \
            fetch -q --depth 1 "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$GITHUB_REF"
          git checkout -q FETCH_HEAD

      - name: Install OCP's system libraries
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libgl1 libglib2.0-0

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Check
        run: |
          uv sync --locked --all-extras
          uv run ruff check
          uv run ruff format --check
          uv run ty check
          uv run pytest -q

  dist:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Clone
        env:
          TOKEN: ${{ github.token }}
        run: |
          git init -q .
          git -c http.extraHeader="Authorization: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)" \
            fetch -q --depth 1 "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$GITHUB_REF"
          git checkout -q FETCH_HEAD

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Build
        run: |
          version="$(uv version --short)"
          if [ "$version" != "${GITHUB_REF_NAME#v}" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $version in pyproject.toml"
            exit 1
          fi
          uv build --no-sources

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  pypi:
    needs: dist
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/brepy/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Publish with trusted publishing
        run: uv publish --trusted-publishing always

  image:
    if: github.event_name != 'pull_request'
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Clone
        env:
          TOKEN: ${{ github.token }}
        run: |
          git init -q .
          git -c http.extraHeader="Authorization: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)" \
            fetch -q --depth 1 "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$GITHUB_REF"
          git checkout -q FETCH_HEAD

      - name: Build and push by digest
        env:
          TOKEN: ${{ github.token }}
          ARCH: ${{ matrix.arch }}
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx create --use
          docker buildx build --platform "linux/$ARCH" --pull --no-cache \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --output "type=image,name=ghcr.io/${GITHUB_REPOSITORY,,},push-by-digest=true,name-canonical=true,push=true" \
            --metadata-file metadata.json -f Containerfile .
          mkdir digests
          digest="$(jq -r '."containerimage.digest"' metadata.json)"
          touch "digests/${digest#sha256:}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.arch }}
          path: digests/*
          if-no-files-found: error
          retention-days: 1

  manifest:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          merge-multiple: true
          path: digests

      - name: Push the multi-platform tag
        env:
          TOKEN: ${{ github.token }}
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) tag="${GITHUB_REF_NAME#v}" ;;
            *)            tag=latest ;;
          esac
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx imagetools create -t "$repo:$tag" $(printf "$repo@sha256:%s " $(ls digests))
