name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "23 10 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/astral-sh/uv:python3.14-trixie@sha256:6137b94a71de738abe2ca9c2b38e1a5eb946c997dcb23dff3865288ecb21a276
    steps:
      - name: Clone
        env:
          TOKEN: ${{ github.token }}
        run: |
          git config --global --add safe.directory "$PWD"
          git init -q .
          git -c http.extraHeader="Authorization: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)" \
            fetch -q --depth 1 "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$GITHUB_REF"
          git checkout -q FETCH_HEAD

      - name: Install OCP's system libraries
        run: |
          apt-get update -q
          apt-get install -y -q --no-install-recommends libgl1 libglib2.0-0

      - name: Check
        run: |
          uv sync --locked --all-extras
          uv run ruff check
          uv run ruff format --check
          uv run ty check
          uv run pytest -q

  image:
    if: github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Clone
        env:
          TOKEN: ${{ github.token }}
        run: |
          git init -q .
          git -c http.extraHeader="Authorization: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)" \
            fetch -q --depth 1 "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$GITHUB_REF"
          git checkout -q FETCH_HEAD

      - name: Build and push
        env:
          TOKEN: ${{ github.token }}
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) tag="${GITHUB_REF_NAME#v}" ;;
            *)            tag=latest ;;
          esac
          image="ghcr.io/${GITHUB_REPOSITORY,,}:$tag"
          docker run --privileged --rm docker.io/tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0 --install arm64
          docker buildx create --use
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx build --platform linux/amd64,linux/arm64 --pull --no-cache \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            -f Containerfile -t "$image" --push .

