name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 10 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Clone
        env:
          TOKEN: ${{ github.token }}
        run: |
          git init -q .
          git -c http.extraHeader="Authorization: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)" \
            fetch -q --depth 1 "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$GITHUB_REF"
          git checkout -q FETCH_HEAD

      - name: Install OCP's system libraries
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libgl1 libglib2.0-0

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Check
        run: |
          uv sync --locked --all-extras
          uv run ruff check
          uv run ruff format --check
          uv run ty check
          uv run pytest -q

  image:
    if: github.event_name != 'pull_request'
    needs: check
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/image.yml
    with:
      ref: ${{ github.ref }}
      tag: latest
